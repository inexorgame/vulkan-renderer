name: Release

on:
  workflow_run:
    workflows: ["GHA"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  nightly-release:
    name: Nightly
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download example builds
        uses: actions/download-artifact@v7
        with:
          pattern: "*-example-*"
          path: archives
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download documentation
        uses: actions/download-artifact@v7
        with:
          name: "documentation"
          path: archives/documentation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare archives for release
        working-directory: archives
        run: |
          for dir in *-example-*; do
            if [[ -d "$dir" ]]; then
              cd "$dir"
              zip -r "../${dir}.zip" ./*
              cd ..
            fi
          done

          if [[ -d documentation ]]; then
            cd documentation
            zip -r ../documentation.zip ./*
            cd ..
          fi

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag nightly
          git push -f origin tag nightly

      # wait 5s that the pushed tag is available in the next step, sometimes the next step saw only the local tag
      - name: Wait 5s
        run: sleep 5s
        shell: bash

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            Latest development release, continuously updated.
        run: |
          output=$(gh release delete nightly -y 2>&1) || [[ "${output}" == "release not found" ]]
          gh release create nightly \
            ./archives/*.zip \
            --title "Nightly Release" \
            --notes "${{ env.NOTES }}" \
            --prerelease \
            --target ${{ github.event.workflow_run.head_sha }}
